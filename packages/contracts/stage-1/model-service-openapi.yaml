openapi: 3.1.0
info:
  title: LDSDT Model Service API
  version: 1.0.0
  description: >-
    Platform-independent API contract for stage-one domestic LLM deployments.
    It intentionally defines a small OpenAI Chat Completions-compatible subset.
    Semester profiles may tighten limits but must not change these operations.
  license:
    name: GPL-3.0-only
    identifier: GPL-3.0-only
servers:
  - url: http://{host}:{port}
    description: Evaluator-injected student service endpoint
    variables:
      host:
        default: 127.0.0.1
      port:
        default: "8000"
security:
  - bearerAuth: []
tags:
  - name: lifecycle
    description: Readiness visible to the evaluator
  - name: metadata
    description: Self-described model service metadata
  - name: inference
    description: Chat completion inference
paths:
  /healthz:
    get:
      operationId: getHealth
      summary: Report whether the model is ready for inference
      tags:
        - lifecycle
      security: []
      responses:
        "200":
          description: The model is loaded and can accept inference requests.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadyHealth"
              example:
                status: ready
        "503":
          description: The service exists but the model is not ready.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StartingHealth"
              example:
                status: starting
  /course/v1/info:
    get:
      operationId: getServiceInfo
      summary: Return the service's model, runtime, and capability declaration
      tags:
        - metadata
      responses:
        "200":
          description: Service information
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServiceInfo"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/chat/completions:
    post:
      operationId: createChatCompletion
      summary: Generate a non-streaming or SSE streaming chat completion
      description: >-
        When stream is false or omitted, the response uses application/json and
        ChatCompletion. When stream is true, the response uses text/event-stream.
        Each SSE data field contains one ChatCompletionChunk JSON object and the
        stream terminates with `data: [DONE]`.
      tags:
        - inference
      parameters:
        - $ref: "#/components/parameters/RequestId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChatCompletionRequest"
            examples:
              code-assistant:
                summary: Deterministic short code request
                value:
                  model: course-model-7b
                  messages:
                    - role: system
                      content: You are a programming assistant.
                    - role: user
                      content: Write a Python function that adds two integers.
                  temperature: 0
                  max_tokens: 256
                  stream: false
      responses:
        "200":
          description: >-
            A JSON completion when stream is false, or an SSE sequence when
            stream is true. The X-LDSDT-Request-ID response header must equal
            the request header.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatCompletion"
            text/event-stream:
              schema:
                type: string
              example: |-
                data: {"id":"chatcmpl-example","object":"chat.completion.chunk","created":1788260000,"model":"course-model-7b","choices":[{"index":0,"delta":{"role":"assistant"},"finish_reason":null}]}

                data: {"id":"chatcmpl-example","object":"chat.completion.chunk","created":1788260000,"model":"course-model-7b","choices":[{"index":0,"delta":{"content":"def add(a, b):"},"finish_reason":null}]}

                data: {"id":"chatcmpl-example","object":"chat.completion.chunk","created":1788260000,"model":"course-model-7b","choices":[{"index":0,"delta":{},"finish_reason":"stop"}]}

                data: [DONE]
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/ModelNotFound"
        "413":
          $ref: "#/components/responses/RequestTooLarge"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/Unavailable"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: LDSDT temporary token
      description: Read from the evaluator-injected LDSDT_API_KEY environment variable.
  parameters:
    RequestId:
      name: X-LDSDT-Request-ID
      in: header
      required: true
      description: Evaluator-provided identifier echoed in the response header and service logs.
      schema:
        type: string
        minLength: 1
        maxLength: 160
        pattern: "^[a-zA-Z0-9][a-zA-Z0-9._:-]*$"
  headers:
    RequestId:
      required: true
      description: Exact echo of the X-LDSDT-Request-ID request header.
      schema:
        type: string
        minLength: 1
        maxLength: 160
  responses:
    BadRequest:
      description: Invalid JSON or request parameters
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error:
              type: invalid_request_error
              message: messages must not be empty
              code: invalid_messages
    Unauthorized:
      description: Missing or invalid bearer token
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error:
              type: authentication_error
              message: Invalid or missing API key
              code: invalid_api_key
    ModelNotFound:
      description: The requested model does not match the deployed model
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    RequestTooLarge:
      description: The request exceeds the supported context or body size
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    RateLimited:
      description: The service's bounded concurrency or resource limit was reached
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    InternalError:
      description: Unexpected service failure
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Unavailable:
      description: The model is not ready to accept inference requests
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  schemas:
    ReadyHealth:
      type: object
      additionalProperties: false
      required:
        - status
      properties:
        status:
          const: ready
    StartingHealth:
      type: object
      additionalProperties: false
      required:
        - status
      properties:
        status:
          const: starting
    ServiceInfo:
      type: object
      additionalProperties: false
      required:
        - schema_version
        - model
        - runtime
        - capabilities
      properties:
        schema_version:
          const: ldsdt.model-service/v1
        model:
          $ref: "#/components/schemas/ModelInfo"
        runtime:
          $ref: "#/components/schemas/RuntimeInfo"
        capabilities:
          $ref: "#/components/schemas/Capabilities"
    ModelInfo:
      type: object
      additionalProperties: false
      required:
        - id
        - precision
        - quantization
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 128
          pattern: "^[a-zA-Z0-9][a-zA-Z0-9._-]*$"
        precision:
          type: string
          enum:
            - fp32
            - fp16
            - bf16
            - int8
            - int4
            - other
        quantization:
          type: string
          minLength: 1
          maxLength: 64
    RuntimeInfo:
      type: object
      additionalProperties: false
      required:
        - backend
        - version
      properties:
        backend:
          type: string
          minLength: 1
          maxLength: 128
        version:
          type: string
          minLength: 1
          maxLength: 128
    Capabilities:
      type: object
      additionalProperties: false
      required:
        - streaming
        - max_context_length
      properties:
        streaming:
          const: true
        max_context_length:
          type: integer
          minimum: 1
    ChatCompletionRequest:
      type: object
      additionalProperties: false
      required:
        - model
        - messages
      properties:
        model:
          type: string
          minLength: 1
          maxLength: 128
        messages:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/ChatMessage"
        temperature:
          type: number
          minimum: 0
          maximum: 2
          default: 1
        max_tokens:
          type: integer
          minimum: 1
        stream:
          type: boolean
          default: false
    ChatMessage:
      type: object
      additionalProperties: false
      required:
        - role
        - content
      properties:
        role:
          type: string
          enum:
            - system
            - user
            - assistant
        content:
          type: string
          minLength: 1
    ChatCompletion:
      type: object
      additionalProperties: false
      required:
        - id
        - object
        - created
        - model
        - choices
      properties:
        id:
          type: string
          minLength: 1
        object:
          const: chat.completion
        created:
          type: integer
          minimum: 0
        model:
          type: string
          minLength: 1
        choices:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/ChatCompletionChoice"
        usage:
          $ref: "#/components/schemas/Usage"
    ChatCompletionChoice:
      type: object
      additionalProperties: false
      required:
        - index
        - message
        - finish_reason
      properties:
        index:
          type: integer
          minimum: 0
        message:
          $ref: "#/components/schemas/AssistantMessage"
        finish_reason:
          type:
            - string
            - "null"
          enum:
            - stop
            - length
            - error
            - null
    AssistantMessage:
      type: object
      additionalProperties: false
      required:
        - role
        - content
      properties:
        role:
          const: assistant
        content:
          type: string
    Usage:
      type: object
      additionalProperties: false
      required:
        - prompt_tokens
        - completion_tokens
        - total_tokens
      properties:
        prompt_tokens:
          type: integer
          minimum: 0
        completion_tokens:
          type: integer
          minimum: 0
        total_tokens:
          type: integer
          minimum: 0
    ChatCompletionChunk:
      type: object
      additionalProperties: false
      required:
        - id
        - object
        - created
        - model
        - choices
      properties:
        id:
          type: string
          minLength: 1
        object:
          const: chat.completion.chunk
        created:
          type: integer
          minimum: 0
        model:
          type: string
          minLength: 1
        choices:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/ChatCompletionChunkChoice"
    ChatCompletionChunkChoice:
      type: object
      additionalProperties: false
      required:
        - index
        - delta
        - finish_reason
      properties:
        index:
          type: integer
          minimum: 0
        delta:
          $ref: "#/components/schemas/ChatCompletionDelta"
        finish_reason:
          type:
            - string
            - "null"
          enum:
            - stop
            - length
            - error
            - null
    ChatCompletionDelta:
      type: object
      additionalProperties: false
      properties:
        role:
          const: assistant
        content:
          type: string
      minProperties: 0
    ErrorResponse:
      type: object
      additionalProperties: false
      required:
        - error
      properties:
        error:
          $ref: "#/components/schemas/ErrorDetail"
    ErrorDetail:
      type: object
      additionalProperties: false
      required:
        - type
        - message
        - code
      properties:
        type:
          type: string
          enum:
            - invalid_request_error
            - authentication_error
            - model_not_found_error
            - request_too_large_error
            - rate_limit_error
            - internal_error
            - service_unavailable_error
        message:
          type: string
          minLength: 1
          maxLength: 2000
        code:
          type: string
          minLength: 1
          maxLength: 128
          pattern: "^[a-z][a-z0-9_]*$"
